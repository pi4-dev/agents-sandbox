# OpenRouter (https://openrouter.ai): one API key, many upstream models.
# LiteLLM model name = "openrouter/<OpenRouter model id>"; ids: https://openrouter.ai/models
#   key:    OPENROUTER_API_KEY in litellm/litellm.env
#   egress: openrouter.ai in squid/conf/llm_api_domains.txt (allowed for LiteLLM only)
# The entries below are examples: keep, change or add models freely.
model_list:
  # OpenRouter picks a model per request

  - model_name: openrouter-gpt-oss-20b
    litellm_params:
      model: openrouter/openai/gpt-oss-20b
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      max_tokens: 131072
      max_input_tokens: 131072
      max_output_tokens: 32768
      supports_function_calling: true
      supports_reasoning: true

  - model_name: openrouter-nvidia-nemotron-3.5-lightning:free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      max_tokens: 1000000
      max_input_tokens: 1000000
      max_output_tokens: 65536
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_function_calling: true
