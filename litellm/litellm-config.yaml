# Models are defined per provider in litellm/models/*.yaml (one file per API endpoint).
# Adding a provider: litellm/models/README.md.
include:
  - models/claude-local.yaml
  - models/openrouter.yaml

litellm_settings:
  drop_params: true
  # /v1/messages (Claude Code) to openai/ deployments goes out as chat/completions,
  # not the Responses API: OpenAI-compatible upstreams (vLLM, another LiteLLM) may
  # have no /v1/responses or rebuild it into several system messages.
  use_chat_completions_url_for_anthropic_messages: true
  request_timeout: 300
general_settings:
  trusted_proxy_ranges: []
  master_key: os.environ/LITELLM_MASTER_KEY
