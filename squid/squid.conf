# ==================================================================
# squid.conf
# ==================================================================

# --- Port + SSL-bump (MITM z wlasnym CA, certy per-host w locie) ---
http_port 3128 ssl-bump \
    tls-cert=/etc/squid/ssl/squid-ca.crt \
    tls-key=/etc/squid/ssl/squid-ca.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 16MB
sslcrtd_children 5

visible_hostname proxy
httpd_suppress_version_string on

pinger_enable off

# --- ACL ---
acl localnet src 192.168.100.0/24 192.19.255.0/16
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

acl full_domains dstdomain "/etc/squid/allowed_domains.txt"
acl path_domains dstdomain "/etc/squid/path_domains.txt"
acl allowed_urls url_regex -i "/etc/squid/allowed_urls.txt"
acl denied_urls  url_regex -i "/etc/squid/denied_urls.txt"

# zakaz zapisu do GitHuba (agent jest read-only wobec GitHuba)
acl api_github    dstdomain api.github.com
acl github_web    dstdomain github.com
acl write_methods method POST PUT PATCH DELETE
acl git_fetch     urlpath_regex -i /git-upload-pack$

# --- Kontrola dostepu ---
# CONNECT wpuszczamy tylko po to, by zestawic tunel i go zbumpowac.
# Wlasciwa decyzja zapada na ROZSZYFROWANYM zadaniu (reguly !CONNECT),
# gdzie dstdomain widzi prawdziwy Host, url_regex pelny URL, method metode.
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# zestawienie tunelu (enforcement nizej, po bumpie)
http_access allow localnet CONNECT full_domains
http_access allow localnet CONNECT path_domains

# rozszyfrowane / plaintextowe zadania — egzekwujemy Host, URL i metode
http_access deny  denied_urls
http_access deny  localnet api_github  write_methods
http_access deny  localnet github_web  write_methods !git_fetch
http_access allow localnet !CONNECT full_domains
http_access allow localnet !CONNECT path_domains allowed_urls
http_access deny all

deny_info TCP_RESET all
deny_info TCP_RESET denied_urls

# --- SSL-bump: deszyfruj WSZYSTKO (peek tylko po to, by zdjac SNI do certu) ---
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

# odrzuc, czego nie da sie zbumpowac (nie-TLS na 443, surowy TCP, inne protokoly).
# respond = odpowiedz bledem zamiast slepego tunelowania; to tez domyslne zachowanie.
on_unsupported_protocol respond all

# nie akceptuj blednych certyfikatow serwerow docelowych (tez domyslne)
sslproxy_cert_error deny all

# --- Prywatnosc / higiena naglowkow ---
forwarded_for delete
via off
reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all
reply_header_access Server deny all
cache deny all
icp_port 0
htcp_port 0
shutdown_lifetime 1 seconds
