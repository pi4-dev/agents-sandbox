name: Bootstrap source import
on:
  push:
    branches: [bootstrap/import-source]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Import archived configuration
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 --decode > /tmp/source.tar.xz
          echo "3c2952dfed3f6803dd9c8766b4e2206c6f219902bec21d84c1f9963dc1524ccf  /tmp/source.tar.xz" | sha256sum --check -
          tar -xJf /tmp/source.tar.xz --strip-components=1 -C .
          rm -rf .bootstrap .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f proxy.env
          if ! git diff --cached --quiet; then
            git commit -m "chore: import agents-env source configuration from baseline archive"
            git push origin HEAD:bootstrap/import-source
          fi
